[package]
name = "eoliann-windows-tools"
version = "1.1.2"
description = "Eoliann Windows Tools"
authors = ["eoliann"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "eoliann_windows_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
# native-tls uses Windows SChannel and the Windows certificate store, like browsers do.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.2"
